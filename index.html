<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life &amp; Career Simulation: Tuần đầu tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --card:#FFFFFF; --ink:#1B2230; --muted:#5B6576; --line:#D3D9E1;
  --choice:#F7F9FB; --chip:#EDF1F6; --blue:#1F5FD1; --blue-ink:#FFFFFF;
  --good:#16794C; --bad:#C42525; --gold:#9A6200; --amber:#B7791F;
  --paper:#FFFFFF; --paper-ink:#1B2230; --paper-muted:#6A6F78; --paper-rule:#DDE6F0;
  --cal-red:#D12B2B; --stack1:#E2DED6; --stack2:#D2CCC1;
  --shadow:0 10px 28px -16px rgba(20,28,40,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --card:#1B2129; --ink:#E6E9EE; --muted:#9BA5B3; --line:#2C3542;
    --choice:#212833; --chip:#27303C; --blue:#7AA2FF; --blue-ink:#0D1320;
    --good:#4CC38A; --bad:#FF6B63; --gold:#F2B851; --amber:#F2B851;
    --paper:#F3F1EC; --paper-ink:#1B2230; --paper-muted:#6A6F78; --paper-rule:#D9DFE7;
    --stack1:#B9B4AA; --stack2:#8E897F;
    --shadow:0 10px 28px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --card:#1B2129; --ink:#E6E9EE; --muted:#9BA5B3; --line:#2C3542;
  --choice:#212833; --chip:#27303C; --blue:#7AA2FF; --blue-ink:#0D1320;
  --good:#4CC38A; --bad:#FF6B63; --gold:#F2B851; --amber:#F2B851;
  --paper:#F3F1EC; --paper-ink:#1B2230; --paper-muted:#6A6F78; --paper-rule:#D9DFE7;
  --stack1:#B9B4AA; --stack2:#8E897F;
  --shadow:0 10px 28px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:16px 14px 32px}
.hand{font-family:'Patrick Hand','Comic Sans MS','Segoe Print',cursive}

/* ---------- Header: lịch bóc ---------- */
.top{display:grid;grid-template-columns:108px 1fr;gap:14px;align-items:start}
.top[hidden],.bars[hidden],.foot[hidden]{display:none}
.cal{padding-bottom:6px}
.cal-page{background:var(--paper);color:var(--paper-ink);border-radius:3px 3px 5px 5px;text-align:center;padding:0 0 9px;overflow:hidden;transform-origin:50% 0;
  box-shadow:0 3px 0 -1px var(--stack1),0 6px 0 -2px var(--stack2),var(--shadow)}
.cal-bind{height:15px;background:var(--cal-red);display:flex;justify-content:space-evenly;align-items:center}
.cal-bind span{width:6px;height:6px;border-radius:50%;background:var(--paper)}
.cal-month{font-size:11px;font-weight:600;color:var(--paper-muted);margin-top:5px}
.cal-num{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.045em;margin-top:1px}
.cal-dow{font-size:13px;font-weight:700}
.cal-page.sun .cal-num,.cal-page.sun .cal-dow{color:var(--cal-red)}
.cal-page.tear{animation:tear .55s ease-in forwards}
.cal-page.enter{animation:enter .35s ease-out}
@keyframes tear{to{transform:translate(-24px,70px) rotate(-14deg);opacity:0}}
@keyframes enter{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.cal-page.tear,.cal-page.enter{animation:none}}

.who{padding-top:4px;min-width:0}
.who-name{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.who-meta{color:var(--muted);font-size:14px;margin-top:2px}
.money{margin-top:8px;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.money small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}

.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
.bar-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:500}
.bar-l b{color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .4s}
.bar i.mid{background:var(--amber)} .bar i.low{background:var(--bad)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

/* ---------- Scene ---------- */
.scene{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.si{font-size:26px;line-height:1}
.sh h2{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.st p{margin:.55em 0}
.quote{font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:19px;line-height:1.35;border-left:3px solid var(--cal-red);padding:2px 0 2px 11px;color:var(--muted);margin:.4em 0 .8em}
.ticket{border:1px dashed var(--line);border-left:6px solid var(--good);border-radius:8px;padding:12px 14px;margin:12px 0 4px;background:var(--choice)}
.ticket.d2{border-left-color:var(--amber)} .ticket.d3{border-left-color:var(--bad)}
.tk-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.tk-title{font-weight:700;font-size:17px;margin:4px 0 2px;line-height:1.35}
.tk-desc{font-size:14.5px;color:var(--muted);margin:0}
.tk-meta{font-size:13px;margin-top:8px;color:var(--muted)}
.tip{font-size:14px;background:var(--chip);border-radius:8px;padding:9px 12px;color:var(--ink)}
.warn{font-size:14px;color:var(--bad);font-weight:600}

.choices{margin-top:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--choice);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:focus-visible,.btn:focus-visible,.ghost:focus-visible,.bgopt:focus-visible,.gopt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.choice:active:not(:disabled){transform:translateY(1px)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.ci{font-size:22px;line-height:1.2;flex:none;width:26px;text-align:center}
.cb{min-width:0}
.cl{font-weight:600;display:block;line-height:1.4}
.cd{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:500}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)} .chip.cost{color:var(--gold)}
.result .chips{margin:12px 0 4px}
.result .chip{font-size:13.5px;padding:4px 11px;font-weight:600}

.btn{display:block;width:100%;margin-top:16px;padding:13px 16px;border:0;border-radius:10px;background:var(--blue);color:var(--blue-ink);font-weight:700;font-size:16px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--chip);color:var(--ink)}

/* ---------- Journal ---------- */
.journal{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 18px 22px;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--paper-rule) 29px,var(--paper-rule) 30px);background-position:0 12px}
.journal h2{font-family:'Patrick Hand','Comic Sans MS',cursive;font-weight:400;font-size:28px;margin:0 0 6px;line-height:1.1}
.journal p,.journal li{font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:20px;line-height:30px;margin:0}
.journal ul{margin:0;padding-left:20px}
.journal .chip{background:rgba(27,34,48,.07);color:#4a5160;font-family:'Be Vietnam Pro',system-ui,sans-serif}
.journal .chip.good{color:#16794C}.journal .chip.bad{color:#C42525}
.journal .chips{margin:6px 0 10px}
.journal .tomorrow{margin-top:12px;color:#2a4d9c}

/* ---------- Week report ---------- */
.report h2{margin:0 0 4px;font-size:24px;line-height:1.2;letter-spacing:-.02em}
.report h3{font-size:15px;margin:20px 0 6px;color:var(--muted);font-weight:700}
.report p{margin:.45em 0}
.rel-row{display:grid;grid-template-columns:26px 1fr 64px 54px;gap:8px;align-items:center;font-size:14.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.rel-row:last-child{border-bottom:0}
.rel-row .bar{margin:0}
.rel-row .dv{text-align:right;font-weight:600}
.dv.good{color:var(--good)}.dv.bad{color:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{background:var(--choice);border:1px solid var(--line);border-radius:10px;padding:10px}
.badge b{display:block;font-size:14.5px}
.badge span{font-size:13px;color:var(--muted)}
.memo{margin:0;padding-left:18px}
.memo li{margin:3px 0}
.story{margin-top:8px}

/* ---------- Title & setup ---------- */
.title-wrap{padding:20px 4px 8px}
.title-cal{width:118px;margin:4px 0 22px}
.title-wrap h1{font-size:36px;line-height:1.08;letter-spacing:-.035em;margin:0 0 10px;font-weight:800}
.title-wrap .lead{font-size:17px;color:var(--muted);margin:0 0 6px;max-width:34em}
.field{margin-top:18px}
.field label,.field .lab{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;font:inherit;font-size:17px;border-radius:10px;border:1.5px solid var(--line);background:var(--choice);color:var(--ink)}
.field input:focus{outline:3px solid var(--blue);outline-offset:1px}
.gopts{display:flex;gap:10px}
.gopt{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--choice);cursor:pointer;font-weight:600}
.gopt[aria-pressed="true"],.bgopt[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.bgopt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--choice);cursor:pointer;margin-top:10px}
.bgopt .cl{font-size:16.5px}

/* ---------- Footer & dialog ---------- */
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;max-width:min(520px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg{padding:20px 18px 18px;max-height:min(80vh,720px);overflow:auto}
.dlg h2{margin:0 0 2px;font-size:21px}
.dlg h3{font-size:14.5px;margin:18px 0 6px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.kv span:nth-child(odd){color:var(--muted)}
/* ---------- v2: nhân vật, khung cảnh, hội thoại, điện thoại ---------- */
#app{padding-bottom:100px}
.foot{padding-right:72px;flex-wrap:wrap}
.top{grid-template-columns:92px 78px 1fr;gap:10px}
.cal-num{font-size:46px}
.avatar svg{display:block;width:78px;height:auto}
.panel{margin:-6px -6px 12px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.panel svg{display:block;width:100%;height:auto}
.bubble{position:relative;background:var(--choice);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0 10px;font-size:16.5px;line-height:1.5}
.bubble::before{content:"";position:absolute;top:-9px;width:15px;height:15px;background:var(--choice);border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:rotate(45deg)}
.bubble.me::before{left:20%}.bubble.npc::before{right:22%}.bubble.solo::before{left:calc(50% - 8px)}
.bubble .who{display:block;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:2px}
.bubble.npc .who{color:var(--gold)}
.talk-ctl{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.talk-n{margin-right:auto;font-size:13px;color:var(--muted)}
.btn.sm,.ghost.sm{width:auto;margin:0;padding:8px 16px;font-size:14.5px;display:inline-block}
.journal{position:relative}
.journal .sticker{position:absolute;top:10px;right:12px;width:58px;height:52px;border-radius:50%;overflow:hidden;background:#FDE8EC;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.journal .sticker svg{width:100%;height:100%;display:block}
.journal h2{padding-right:70px}
.hero{width:132px;margin:0 auto 4px}
.hero svg{display:block;width:100%;height:auto}
/* điện thoại */
.phone-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--blue);color:var(--blue-ink);font-size:26px;cursor:pointer;z-index:30;box-shadow:0 8px 22px -8px rgba(20,40,90,.55)}
.phone-fab[hidden]{display:none}
.phone-fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.phone-fab .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#E5484D;color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.phone-fab .badge[hidden]{display:none}
.phone-fab.ring{animation:ring .9s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.phone-fab.ring{animation:none}}
.ph-frame{max-width:360px;margin:10px auto 6px;border:2px solid var(--line);border-radius:22px;overflow:hidden;background:var(--bg)}
.ph-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.ph-av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#FDE8EC;flex:none;display:block}
.ph-av.big{width:54px;height:54px}
.ph-av svg{width:100%;height:100%;display:block}
.ph-msgs{padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-msgs.thread{max-height:46vh;overflow:auto;background:var(--bg);border-radius:12px;margin:8px 0}
.msg{max-width:84%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.msg.in{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.out{background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:5px;align-self:flex-end}
.msg .au{display:block;font-size:12px;font-weight:700;color:var(--gold)}
.ph-day{align-self:center;font-size:12px;color:var(--muted);margin:4px 0}
.reply-lbl{font-size:14px;color:var(--muted);margin:12px 0 0}
.reply{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:600;cursor:pointer}
.reply:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ph-head h2{margin:0}.ph-name{flex:1;text-align:center}
.ph-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.ph-item:focus-visible{outline:3px solid var(--blue);outline-offset:-2px}
.ph-txt{min-width:0;flex:1}.ph-txt b{display:block}
.ph-txt span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-badge{background:#E5484D;color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 6px;flex:none}
.ph-wait{font-size:12px;color:var(--gold);font-weight:600;flex:none}
.ph-empty{color:var(--muted)}
.prof-top{display:flex;align-items:center;gap:12px}
/* tạo nhân vật */
.look{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
.look-pv{background:#FDE8EC;border-radius:14px;padding:8px}
.look-pv svg{display:block;width:100%;height:auto}
.look-opts .sub{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:2px 0 6px}
.hairs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.hairopt{padding:4px 2px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--choice);cursor:pointer;font-size:12px;font-weight:600}
.hairopt svg{display:block;width:44px;height:40px;margin:0 auto}
.hairopt[aria-pressed="true"],.sw[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.hairopt:focus-visible,.sw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 0}
.title-art{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
.title-art .title-cal{margin:0}
.title-chibi{width:120px}.title-chibi svg{display:block;width:100%;height:auto}
@media (max-width:380px){.look{grid-template-columns:1fr}.look-pv{max-width:150px;margin:0 auto}.top{grid-template-columns:84px 70px 1fr}.avatar svg{width:70px}}
/* ---------- v3 ---------- */
.etag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;margin:0 0 6px;background:var(--chip);color:var(--muted)}
.etag.scheduled{color:var(--blue)}.etag.consequence{color:var(--bad)}.etag.random{color:var(--gold)}
.cause{margin:0 0 6px;font-style:italic;color:var(--muted)}
.ebreak{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;background:var(--choice);font-size:14.5px}
.eb-h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.eb-r{display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:var(--muted)}
.eb-r b{color:var(--ink)}.eb-r b.good{color:var(--good)}.eb-r b.bad{color:var(--bad)}
.plan{font-size:14.5px;background:var(--chip);border-radius:8px;padding:9px 12px}
.food{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--choice)}
.food-top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:6px}
.habits{margin-top:8px}
.hb{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.hb:last-child{border-bottom:0}
.lv{font-weight:600}.lv.good{color:var(--good)}.lv.ok{color:var(--gold)}.lv.bad{color:var(--bad)}
.muted{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.hairopt.alt{opacity:.6}
/* ---------- v4: animation ---------- */
.cb{transform-box:fill-box;transform-origin:50% 100%}
.cb .cb-armL,.cb .cb-armR,.cb .cb-head,.cb .cb-eye,.cb .cb-torso,.cb .cb-alarm{transform-box:fill-box}
.cb .cb-armL{transform-origin:80% 3%}.cb .cb-armR{transform-origin:20% 3%}
.cb .cb-head{transform-origin:50% 100%}.cb .cb-eye{transform-origin:50% 50%}.cb .cb-torso{transform-origin:50% 100%}
.cb .cb-alarm{transform-origin:50% 50%}
.cb .cb-front{display:none}
.anim-yawn .cb-front,.anim-rub .cb-front,.anim-headache .cb-front{display:inline}
.anim-yawn .cb-backarms,.anim-rub .cb-backarms,.anim-headache .cb-backarms{display:none}
.cb-idle .cb-eye{animation:blink 4.6s infinite}
.cb-idle .cb-torso{animation:breathe 3.4s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes breathe{50%{transform:scaleY(1.035)}}

const SAVE_KEY = 'lcs-tuan-dau-tien-v3';
let S = null;
let current = null;

const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
const fmtTr = n => (n/1e6).toLocaleString('vi-VN', { maximumFractionDigits:1 }) + ' triệu';
const clamp = (v, a=0, b=100) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const P = (...ls) => ls.filter(Boolean).map(l => `<p>${l}</p>`).join('');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function fmtH(h){ const H = Math.floor(h), M = Math.round((h-H)*60); return M ? `${H} tiếng ${M} phút` : `${H} tiếng`; }
function clock(h){ h = ((h % 24) + 24) % 24; const H = Math.floor(h), M = Math.round((h-H)*60); return String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0'); }

function rel(k, d){ S.rel[k] = (S.rel[k] ?? 50) + d; }
function eat(v){ logMeal(v >= 20 ? 'home' : v >= 10 ? 'cook' : v > 0 ? 'ot' : 'skip'); }
function note(t){ S.notes.push(t); }
function memo(t){ S.memo.push({ day:S.day, text:t }); }
function co(){ return COMPANIES[S.job ? S.job.co : S.applied]; }
function isWorkday(d = S.day){ return !!S.job && d >= S.job.start && d <= 5; }
function goingOut(d = S.day){ return isWorkday(d) || d === S.ivDay || d === S.backupDay; }
function snap(){ return { money:S.money, energy:S.energy, health:S.health, mood:S.mood, tech:S.tech, soft:S.soft, rel:{ ...S.rel } }; }
function clampAll(){
  ['health','mood','tech','soft'].forEach(k => S[k] = clamp(Math.round(S[k]))); S.energy = clamp(Math.round(S.energy), 0, energyCap());
  Object.keys(S.rel).forEach(k => S.rel[k] = clamp(Math.round(S.rel[k])));
  S.money = Math.round(S.money);
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {} }
function load(){ try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function wipe(){ try { localStorage.removeItem(SAVE_KEY); } catch(e) {} }

/* =========================================================
   v3: NĂNG LƯỢNG, GIẤC NGỦ, THỜI GIAN BUỔI SÁNG, CÔNG THỨC CHỈ SỐ,
       THÓI QUEN ĂN UỐNG, CV, LOẠI SỰ KIỆN
   ========================================================= */
const CO_COLOR = { hotay:'#2F6FD1', banhmi:'#E9A23B', cudem:'#4B3F72', loren:'#8C5A3C' };
const energyCap = () => Math.round(100 - Math.max(0, 60 - S.health) * .6);

/* ----- Giấc ngủ: năng lượng sáng = năng lượng tối + hồi phục, trừ các hiệu ứng ----- */
function wakeRows(base, h, bed, debtBefore, hangover){
  // Thứ tự: năng lượng tối + hồi phục khi ngủ → giới hạn trần → trừ các hiệu ứng (để hậu quả không bị "che" bởi trần 100)
  const rows = [['Năng lượng trước khi ngủ', base, 'base'], [`Ngủ ${fmtH(h)}`, Math.round(h * BAL.SLEEP_RATE)]];
  let e = base + rows[1][1];
  const cap = energyCap();
  if (e > cap) { rows.push([cap < 100 ? `Phần vượt trần năng lượng (sức khỏe giới hạn ở ${cap})` : 'Phần vượt mức tối đa 100', cap - e]); e = cap; }
  const debt = Math.max(0, debtBefore + BAL.SLEEP_NEED - h);
  const pen = Math.min(BAL.DEBT_MAX_PENALTY, Math.round(debt * BAL.DEBT_PENALTY));
  if (pen) { rows.push([`Nợ ngủ tích lũy (${fmtH(debt)})`, -pen]); e -= pen; }
  if (hangover) { rows.push(['Dư âm bia hơi tối qua', -BAL.HANGOVER]); e -= BAL.HANGOVER; }
  if (bed >= 25) { rows.push(['Đi ngủ sau 1 giờ sáng', -BAL.LATE_BED_PENALTY]); e -= BAL.LATE_BED_PENALTY; }
  return { rows, e:Math.max(5, e), debt };
}
function applyWake(){
  S.wakeInfo = null; S.am = null; S.lateToday = false; S.lateMin = 0;
  if (S.day === 1) { S.energy = 80; return; }
  const h = S.sleep, base = S.eveEnergy ?? S.energy;
  const w = wakeRows(base, h, S.bedHour || 23, S.sleepDebt || 0, S.hangover);
  if (S.hangover) S.health -= 2;
  S.energy = w.e; S.sleepDebt = w.debt; S.wakeInfo = w.rows;
  if (h >= 7) S.mood += 2; else if (h < 5) { S.mood -= 5; S.health -= 2; } else if (h < 6) S.mood -= 2;
  S.sleepLog.push(h);
  S.flags.hangoverToday = S.hangover; S.hangover = false;
  note(`Ngủ ${fmtH(h)}: năng lượng ${base} lúc đi ngủ, ${S.energy} khi thức dậy.`);
  if (goingOut()) planMorning();
}
function wakeTable(){
  if (!S.wakeInfo) return '';
  return `<div class="ebreak"><div class="eb-h"><span>⚡ Năng lượng sáng nay</span><b>${S.energy}</b></div>${S.wakeInfo.map(([l, v, k]) =>
    `<div class="eb-r"><span>${l}</span><b class="${k === 'base' ? '' : v > 0 ? 'good' : 'bad'}">${k === 'base' ? v : (v > 0 ? '+' : '−') + Math.abs(v)}</b></div>`).join('')}</div>`;
}

/* ----- Buổi sáng: dậy + chuẩn bị + đi đường + chậm trễ = giờ đến ----- */
const hm = m => clock(m / 60);
function commuteTo(d){ const c = isWorkday(d) ? S.job.co : d === S.backupDay ? 'loren' : S.applied; return BAL.COMMUTE[S.bg][c] || 30; }
function alarmFor(d){
  if (d > 7) return S.job ? (BAL.APPOINT - BAL.PREP_MIN - (BAL.COMMUTE[S.bg][S.job.co] || 30) - BAL.BUFFER_MIN) / 60 : BAL.WAKE_FREE;
  if (goingOut(d)) return (BAL.APPOINT - BAL.PREP_MIN - commuteTo(d) - BAL.BUFFER_MIN) / 60;
  return d >= 6 ? BAL.WAKE_WEEKEND : BAL.WAKE_FREE;
}
function planMorning(){
  const commute = commuteTo(S.day), wake = Math.round(alarmFor(S.day) * 60);
  const p = Math.min(.7, .04 + (S.sleepDebt || 0) * .07 + (S.flags.hangoverToday ? .25 : 0));
  const over = chance(p) ? 10 + Math.floor(Math.random() * 31) : 0;
  S.am = { wake, prep:BAL.PREP_MIN, commute, delays: over ? [['Ngủ quên sau báo thức', over]] : [] };
  if (over) note(`Ngủ quên ${over} phút sau báo thức.`);
  recalcArrival();
}
function recalcArrival(){
  if (!S.am) { S.lateToday = false; S.lateMin = 0; return; }
  const a = S.am; a.arrive = a.wake + a.prep + a.commute + a.delays.reduce((x, d) => x + d[1], 0);
  S.lateMin = Math.max(0, a.arrive - BAL.APPOINT); S.lateToday = S.lateMin > 0;
}
function addDelay(label, min){ if (!S.am) return; S.am.delays.push([label, min]); recalcArrival(); }
const arrClock = () => S.am ? hm(S.am.arrive) : '09:00';
const arrEarly = () => { const n = S.am ? BAL.APPOINT - S.am.arrive : 10; return n > 0 ? `sớm ${n} phút` : 'vừa kịp giờ'; };
function arriveTxt(){ if (!S.am) return ''; return S.lateToday ? `Dự kiến đến lúc ${arrClock()}, muộn ${S.lateMin} phút.` : `Dự kiến đến lúc ${arrClock()}, vẫn kịp giờ.`; }
function morningLine(){
  const a = S.am; if (!a) return '';
  const ds = a.delays.map(d => `${d[0].toLowerCase()} ${d[1] > 0 ? '+' : '−'}${Math.abs(d[1])} phút`).join(', ');
  return `🕘 Báo thức ${hm(a.wake)}, chuẩn bị ${a.prep} phút, đi xe máy ${a.commute} phút${ds ? ', ' + ds : ''}. Dự kiến đến lúc <b>${hm(a.arrive)}</b> (hẹn 09:00)${S.lateToday ? `, <span class="warn">muộn ${S.lateMin} phút</span>` : ''}.`;
}

/* ----- Ban đêm: dinh dưỡng, áp lực công việc, tinh thần về mức trung bình, áp lực tài chính ----- */
function finPressure(){
  const b = BAL.BG[S.bg], days = S.job ? BAL.DAYS_TO_PAYDAY + (7 - S.day) : 30;
  const need = b.rent + BAL.LIVING_PER_MONTH * days / 30, r = S.money / need;
  if (r < .6) return { label:'Báo động', pen:6, note:'Lo tiền nhà và tiền ăn sắp tới: tinh thần −6.' };
  if (r < 1) return { label:'Hơi chật vật', pen:3, note:'Bắt đầu lo chuyện tiền bạc: tinh thần −3.' };
  return { label: r >= 1.6 ? 'Thoải mái' : 'Ổn định', pen:0 };
}
function nightly(){
  updateNutr();
  if (S.nutr < 30) { S.health -= 3; note('Ăn uống kém nhiều bữa liền: sức khỏe giảm.'); }
  else if (S.nutr < 40) { S.health -= 2; note('Ăn uống thất thường: sức khỏe giảm nhẹ.'); }
  else if (S.nutr >= 70) S.health += 1;
  if (isWorkday()) S.mood -= BAL.WORK_STRESS;
  S.mood -= Math.round((S.mood - 60) * BAL.MOOD_DRIFT);
  const fp = finPressure(); if (fp.pen) { S.mood -= fp.pen; note(fp.note); }
}

/* ----- Công thức điểm cộng: giảm dần khi chỉ số cao, khi lặp lại, khi mệt; tinh thần phụ thuộc độ thân ----- */
const repeatCount = id => id === 'hangout' ? 0 : (S.actLog || []).filter(x => x.id === id && x.d >= S.day - 1).length;
function shapeGains(before, actId, npc){
  const fade = actId ? Math.pow(BAL.REPEAT_FADE, repeatCount(actId)) : 1;
  const learn = before.energy < 30 ? BAL.LOW_ENERGY_LEARN : 1;
  const relF = npc && before.rel[npc] !== undefined ? .75 + before.rel[npc] / 200 : 1;
  const dim = v => 1 - Math.pow(v / 100, 2) * BAL.DIMINISH;
  for (const k of ['mood','health','tech','soft']) {
    const d = S[k] - before[k];
    if (d > 0) S[k] = before[k] + d * fade * dim(before[k]) * (k === 'mood' ? relF : 1) * (k === 'tech' || k === 'soft' ? learn : 1);
  }
  for (const k of Object.keys(S.rel)) { const d = S.rel[k] - before.rel[k]; if (d > 0) S.rel[k] = before.rel[k] + d * fade * (1 - Math.pow(before.rel[k] / 100, 2) * .6); }
  if (actId) { (S.actLog = S.actLog || []).push({ id:actId, d:S.day }); if (S.actLog.length > 40) S.actLog.shift(); }
}

/* ----- Thói quen ăn uống: tính theo khoảng 10 bữa gần nhất ----- */
const MEAL_TAGS = { home:{ name:'Cơm nhà', v:85 }, cook:{ name:'Tự nấu', v:80 }, rice:{ name:'Cơm bụi, cơm văn phòng', v:65 }, bun:{ name:'Bún, phở ngoài quán', v:60 },
  app:{ name:'Đồ ăn qua ứng dụng', v:50 }, ot:{ name:'Cơm hộp công ty', v:55 }, bread:{ name:'Bánh mì', v:42 }, party:{ name:'Đồ nhậu', v:30 }, noodle:{ name:'Mì tôm', v:20 }, skip:{ name:'Bỏ bữa', v:0 } };
const FAST = ['app','noodle','bread','party'];
const APP_DISHES = [
  { name:'gà rán sốt cay', v:28, t:'Ngon, giòn, và bạn biết chắc là không tốt cho sức khỏe lắm.' },
  { name:'cơm gà xối mỡ', v:48, t:'No căng bụng. Phí giao hàng bằng nửa giá món.' },

function updateNutr(){ const last = [...Array(10).fill({ v:60 }), ...(S.meals || [])].slice(-10); S.nutr = Math.round(last.reduce((a, m) => a + m.v, 0) / last.length); }
function logMeal(tag, v){ (S.meals = S.meals || []).push({ d:S.day, tag, v: v ?? MEAL_TAGS[tag].v }); if (S.meals.length > 30) S.meals.shift(); updateNutr(); }
// Thêm thói quen mới: thêm một dòng vào đây, đặt on:true khi đã có dữ liệu
const HABITS = [
  { id:'regular', name:'Ăn đủ bữa', on:true, eval:m => { const n = m.slice(-6).filter(x => x.tag === 'skip').length; return n === 0 ? ['good','Đều đặn'] : n === 1 ? ['ok','Thỉnh thoảng bỏ bữa'] : ['bad','Hay bỏ bữa']; } },
  { id:'variety', name:'Ăn đa dạng', on:true, eval:m => { const n = new Set(m.slice(-8).map(x => x.tag)).size; return n >= 4 ? ['good','Phong phú'] : n === 3 ? ['ok','Tạm ổn'] : ['bad','Ăn đi ăn lại vài món']; } },
  { id:'fast', name:'Đồ ăn nhanh', on:true, eval:m => { const n = m.slice(-8).filter(x => FAST.includes(x.tag)).length; return n <= 1 ? ['good','Ít'] : n <= 3 ? ['ok','Vừa phải'] : ['bad','Nhiều, cần cải thiện']; } },
  { id:'homecook', name:'Cơm nhà, tự nấu', on:true, eval:m => { const n = m.slice(-8).filter(x => x.tag === 'home' || x.tag === 'cook').length; return n >= 3 ? ['good','Thường xuyên'] : n >= 1 ? ['ok','Thỉnh thoảng'] : ['bad','Chưa có bữa nào']; } },
  { id:'water', name:'Uống đủ nước', on:false, eval:() => ['ok','Sẽ có trong bản sau'] },

function foodProfile(){
  const m = S.meals || [], v = S.nutr;
  return { v, label: v >= 70 ? 'Tốt' : v >= 55 ? 'Khá' : v >= 40 ? 'Tạm ổn' : 'Cần cải thiện', rows: m.length ? HABITS.filter(h => h.on).map(h => [h.name, ...h.eval(m)]) : [] };
}
function foodHTML(){

    ${f.rows.length ? `<div class="habits">${f.rows.map(([n, l, t]) => `<div class="hb"><span>${n}</span><span class="lv ${l}">${t}</span></div>`).join('')}</div>` : '<p class="muted">Chưa có dữ liệu bữa ăn.</p>'}
    <p class="muted">Tính theo khoảng 10 bữa gần nhất: một bữa không ảnh hưởng nhiều, thói quen mới quan trọng.</p></div>`;
}

/* ----- CV: độ nổi bật, độ trung thực, kỹ năng đã khai ----- */
function setCV(stand, honest, real, fake){
  S.cv = { stand, honest, real, fake };
  S.flags.buzz = fake.length > 0 && chance((10 - honest) / 10 + .1);

const EV_TYPE = { traffic:'random', rain:'random', morebattle:'consequence', noodle:'consequence', sleepdebt:'consequence', coffee_run:'random', birthday:'random',

function sceneType(ref){
  const id = ref.id;
  if (id === 'ev') return { t:EV_TYPE[ref.arg], cause: EV_CAUSE[ref.arg] ? EV_CAUSE[ref.arg]() : '' };
  if (id === 'iv_arrive' || id === 'iv_result' || id === 'ob_arrive') return { t:'scheduled' };
  if (id === 'call_invite') return { t:'consequence', cause:'Vì sáng nay bạn đã nộp hồ sơ…' };
  if (id === 'bk_call') return { t:'random' };
  if (id === 'bug_back') { const b = S.bugs.find(x => x.due <= S.day); return { t:'consequence', cause: b ? `Vì hôm trước bạn chọn “làm nhanh” task ${b.title}…` : '' }; }
  if (id === 'bug_weekend') return { t:'consequence', cause:'Vì trong tuần có một task bị làm vội…' };
  if (id === 'wake' && S.flags.hangoverToday) return { t:'consequence', cause:'Vì tối qua đi bia hơi với Tùng…' };
  if (id === 'wake' && (S.day === S.ivDay || (S.job && S.day === S.job.start))) return { t:'scheduled' };
  if (id === 'endwork' && ref.arg && ref.arg.ask && S.otTonight !== true && !S.unfinished) return { t:'random' };
  return {};
}
const typeHTML = ty => ty && ty.t ? `<div class="etag ${ty.t}">${ET[ty.t]}</div>${ty.cause ? `<p class="cause">${ty.cause}</p>` : ''}` : '';

function buildSlot(){
  const q = [], d = S.day, s = S.slot;
  const work = isWorkday(), first = work && d === S.job.start;
  if (s === 'morning') {
    q.push({ id:'wake' });
    if ((S.sleepDebt || 0) >= 3 && !S.once['sd' + d]) { S.once['sd' + d] = true; q.push({ id:'ev', arg:'sleepdebt' }); }
    if (d === 1) q.push({ id:'d1_cv' }, { id:'apply' });
    else if (d === S.ivDay) { pushCommute(q); q.push({ id:'iv_arrive' }, { id:'iv_hr', arg:0 }, { id:'iv_hr', arg:1 }, { id:'iv_hr', arg:2 }, { id:'iv_tech' }); }
    else if (d === S.backupDay) q.push({ id:'bk_call' });
    else if (work) {
      pushCommute(q);
      if (first) q.push({ id:'ob_arrive' }, { id:'ob_env' }, { id:'ob_team' });
      else { q.push({ id:'standup' }, { id:'task', arg:{} }); maybeEvent(q, 'workmorning'); }
    } else {
      if (d === 6 && S.bugs.length) q.push({ id:'bug_weekend' });
      if (d >= 6) maybeEvent(q, 'weekendmorning');
      q.push({ id:'activity', arg:'morning' });
    }
  } else if (s === 'noon') {
    q.push({ id:'meal', arg:'lunch' });
  } else if (s === 'afternoon') {
    if (d === 1) q.push({ id:'call_invite' }, { id:'activity', arg:'afternoon' });
    else if (d === S.ivDay) q.push({ id:'iv_result' }, { id:'activity', arg:'afternoon' });
    else if (work) {
      if (S.bugs.some(b => b.due <= d)) q.push({ id:'bug_back' });
      q.push({ id:'task', arg:{ first } });
      if (!first) maybeEvent(q, 'workafternoon');
      q.push({ id:'endwork', arg:{} });
    } else { maybeEvent(q, 'freeafternoon'); q.push({ id:'activity', arg:'afternoon' }); }
  } else if (s === 'evening') {
    if (S.otTonight === true) q.push({ id:'ot' });
    else if (S.otTonight === 'home') q.push({ id:'meal', arg:'dinner' }, { id:'homework' });
    else { q.push({ id:'meal', arg:'dinner' }); maybeEvent(q, 'evening'); q.push({ id:'activity', arg:'evening' }); }
  } else if (s === 'night') {
    if (S.flags.gamedTonight && chance(.6)) q.push({ id:'ev', arg:'morebattle' });
    if (S.stat.miTom >= 3 && !S.once.noodle) { S.once.noodle = true; q.push({ id:'ev', arg:'noodle' }); }
    q.push({ id:'bedtime' }, { id:'dayReport' });
  }
  if (s === 'morning' || s === 'afternoon' || s === 'evening') maybeMsg(s);
  S.queue = q;
}

function pushCommute(q){
  if (chance(.3)) q.push({ id:'ev', arg:'traffic' });
  else if (chance(.15)) q.push({ id:'ev', arg:'rain' });
}

function maybeEvent(q, ctx){
  const pool = shuffle(Object.entries(EVENTS).filter(([id, e]) => e.ctx && e.ctx.includes(ctx) && !S.once[id] && (!e.cond || e.cond())));
  for (const [id, e] of pool) {
    const p = typeof e.chance === 'function' ? e.chance() : e.chance;
    if (chance(p)) { S.once[id] = true; q.push({ id:'ev', arg:id }); return; }
  }
}

function advance(){
  let guard = 0;
  while (!S.queue.length && guard++ < 6) {
    const i = SLOTS.indexOf(S.slot);
    if (i >= SLOTS.length - 1) return startDay();
    S.slot = SLOTS[i+1];
    S.energy = Math.max(0, S.energy - BAL.SLOT_DRAIN);
    tickPhone();
    buildSlot();
  }
  S.cur = S.queue.shift();
  save();
  renderScene();
}

function drawTask(easy){
  if (!S.deck.length) S.deck = shuffle(TASKS.map(t => t.id));
  let i = easy ? S.deck.findIndex(id => TASK[id].d === 1) : 0;
  if (i < 0) i = 0;
  return S.deck.splice(i, 1)[0];
}

SC.task = (arg) => {
  const ref = S.cur;
  if (!ref.arg || typeof ref.arg !== 'object') ref.arg = {};
  if (!ref.arg.tid) { ref.arg.tid = drawTask(ref.arg.first); save(); }
  const t = TASK[ref.arg.tid];
  const lowE = (S.energy < 25 ? .18 : 0) - (S.mood - 50) / 500;
  const card = `<div class="ticket d${t.d}">
      <div class="tk-top"><span>#LCS-${t.id}</span><span>Độ khó ${'●'.repeat(t.d)}${'○'.repeat(3-t.d)}</span></div>
      <div class="tk-title">${t.icon} ${t.title}</div>
      <p class="tk-desc">${t.desc}</p>
      <div class="tk-meta">Hạn: ${DEADLINE[t.d]}</div></div>`;
  const intro = ref.arg.first
    ? '<p class="tip">Mỗi task là một lá bài. Không có cách xử lý nào đúng tuyệt đối: làm nhanh thì có rủi ro, làm kỹ thì tốn sức, hỏi người khác thì tốn… sự kiên nhẫn của họ.</p>'
    : P(S.slot === 'morning' ? 'Họp xong, task mới xuất hiện trên bảng của bạn.' : 'Buổi chiều, thêm một task nữa.');
  const warn = S.energy < 25 ? '<p class="warn">Năng lượng đang rất thấp. Làm gì lúc này cũng dễ hỏng hơn.</p>' : '';
  const n = S.askCount + 1;
  const choices = [
    { icon:'⚡', label:'Làm nhanh cho xong', hints:['⏱ Khoảng 1 giờ','⚠️ Có thể sót lỗi','⚡ −8'], fx:() => {
      S.energy -= 8; S.stat.tasks++; S.perf += 1;
      if (chance(.62 + S.tech/200 - t.d*.12 - lowE))
        return `Bạn xử lý “${t.title}” trong chưa đầy một tiếng. Chị Mai kiểm tra lại, không thấy vấn đề gì. Hôm nay vũ trụ đứng về phía bạn.`;
      S.stat.bugsMade++; S.bugs.push({ id:t.id, title:t.title, due:S.day + 1 });
      return `Xong “${t.title}” trong 40 phút, đẩy code lên luôn. Có một cảm giác mơ hồ là bạn đã quên kiểm tra trường hợp nào đó. Cảm giác này thường đúng.`; } },
    { icon:'🔬', label:'Làm kỹ từng bước', hints:['⏱ Khoảng 3 giờ','🧠 +2 Chuyên môn','⚡ −15'], fx:() => {
      S.energy -= 15; S.tech += 2; S.stat.tasks++;
      if (chance(.9 + S.tech/300 - t.d*.13 - lowE)) { S.perf += 2;
        return `Bạn làm “${t.title}” cẩn thận từng bước, viết cả ghi chú. Chị Mai test xong nhắn: “Sạch sẽ ghê.” Bạn học thêm được vài điều.`; }
      S.unfinished = t.title;
      return `Bạn làm kỹ đến mức… chưa xong. “${t.title}” khó hơn bạn tưởng. Hết giờ mà vẫn còn dang dở.`; } },
    { icon:'🎧', label:'Hỏi anh Dũng (senior)', hints: n <= 2 ? ['⏱ Nhanh','🤝 Anh Dũng sẵn lòng'] : ['⏱ Nhanh',`😬 Lần hỏi thứ ${n} hôm nay`], fx:() => {
      S.askCount++; S.energy -= 6; S.stat.tasks++; S.perf += 1;
      if (S.askCount <= 2) { rel('dung',4); S.tech += 1;
        return `Anh Dũng tháo một bên tai nghe, chỉ đúng chỗ cần sửa trong 2 phút. “${t.title}” xong gọn. Bạn học được một mẹo hay.`; }
      rel('dung',-6);
      return `Đây là lần thứ ${S.askCount} hôm nay bạn hỏi. Anh Dũng tháo tai nghe, thở dài rất khẽ, rồi vẫn chỉ cho bạn. Task xong, nhưng không khí hơi… lạnh.`; } },
    S.otTonight === true
      ? { icon:'🌙', label:'Gộp vào buổi OT tối nay', hints:['✅ Chắc chắn xong'], fx:() => { S.perf += 2; S.stat.tasks++;
          return `Bạn ghi “${t.title}” vào danh sách việc tối nay. Danh sách đó đang dài ra.`; } }
      : { icon:'🌙', label:'Để tối ở lại OT', hints:['✅ Chắc chắn xong','👍 Sếp để ý','🌙 Mất buổi tối'], fx:() => {
          S.otTonight = true; S.perf += 2; rel('boss',2); S.stat.tasks++;
          return `Bạn quyết định để “${t.title}” lại tối nay làm cho chắc. Chị Hạnh để ý và gật đầu. Buổi tối của bạn vừa chính thức thuộc về công ty.`; } },
  ];
  return { icon:'🗂️', title: ref.arg.first ? 'Task đầu tiên' : 'Task mới', html: intro + card + warn, choices };
};

function previewTomorrow(){
  const d = S.day + 1;
  if (d > 7) return '';
  if (d === S.ivDay) return `Ngày mai: phỏng vấn ở ${COMPANIES[S.applied].name}, 9 giờ sáng.`;
  if (S.job && d === S.job.start) return `Ngày mai: ngày đầu tiên đi làm ở ${COMPANIES[S.job.co].name}. Nhớ đặt báo thức.`;
  if (isWorkday(d)) return 'Ngày mai: đi làm, có mặt lúc 9 giờ.';
  if (d >= 6) return 'Ngày mai: cuối tuần!';
  return 'Ngày mai: chưa có lịch gì.';
}

}

function playerCtx(){
  const id = S.cur && S.cur.id;
  if (id === 'wake' || id === 'bedtime' || S.slot === 'night') return 'sleep';
  if (S.slot === 'evening') return S.otTonight === true ? 'work' : 'casual';
  return goingOut() ? 'work' : 'casual';
}
function playerLook(ctx = playerCtx()){
  const L = lookToL(S.look, ctx, S.gender);
  if (ctx === 'work') { L.badge = isWorkday(); L.tie = !isWorkday(); L.badgeColor = S.job ? CO_COLOR[S.job.co] : null; }
  return L;
}
function playerExpr(){
  if (S.flags.hangoverToday && S.slot === 'morning') return 'drunk';
  if (S.health < 35) return 'sick';
  if (S.energy < 25) return 'tired';

  if (S.mood >= 75 && S.energy >= 45) return 'happy';

// Âm thanh tổng hợp bằng Web Audio, không cần file ngoài
const SFX = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('lcs-sound') !== 'off'; } catch (e) {}
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, t0, dur, type = 'sine', vol = .1, f2 = null){
    const c = ac(); if (!c) return; const t = c.currentTime + t0;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .03);
  }
  function noise(t0, dur, vol = .08, freq = 1200){
    const c = ac(); if (!c) return; const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(c.currentTime + t0);
  }
  const lib = {
    alarm:   () => { for (let i = 0; i < 3; i++) { tone(1320, i * .2, .08, 'square', .045); tone(1320, i * .2 + .09, .06, 'square', .03); } },
    stretch: () => { tone(523, 0, .2, 'sine', .09); tone(659, .13, .2, 'sine', .09); tone(784, .26, .35, 'sine', .09); },
    yawn:    () => { tone(330, 0, 1, 'sine', .08, 170); noise(.05, .7, .025, 500); },
    rub:     () => { tone(392, 0, .4, 'triangle', .06, 330); },
    groan:   () => { tone(210, 0, .8, 'sawtooth', .035, 140); },
    jolt:    () => { tone(880, 0, .08, 'square', .05); tone(1175, .09, .16, 'square', .05); },
    tear:    () => noise(0, .28, .12, 2600),
    coin:    () => { tone(988, 0, .08, 'square', .035); tone(1319, .07, .2, 'square', .035); },
    gain:    () => { tone(660, 0, .12, 'sine', .07); tone(880, .1, .22, 'sine', .07); },
    loss:    () => { tone(300, 0, .3, 'triangle', .07, 200); },
    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .38, 'triangle', .08)),
    sad:     () => { tone(392, 0, .35, 'triangle', .07); tone(311, .3, .65, 'triangle', .07); },
    notify:  () => { tone(1047, 0, .1, 'sine', .07); tone(1397, .12, .18, 'sine', .07); },
    pop:     () => tone(520, 0, .14, 'sine', .07, 800),
    bell:    () => { tone(880, 0, .7, 'sine', .06); tone(1320, 0, .7, 'sine', .025); },
    dun:     () => tone(150, 0, .55, 'triangle', .09, 105),
    talk:    () => tone(480 + Math.random() * 140, 0, .05, 'triangle', .025),
    hop:     () => tone(600, 0, .1, 'sine', .05, 900),
  };
  return {
    play(n, delay = 0){ if (!on || !lib[n]) return; const f = () => { try { lib[n](); } catch (e) {} }; delay ? setTimeout(f, delay) : f(); },
    get on(){ return on; },
    toggle(){ on = !on; try { localStorage.setItem('lcs-sound', on ? 'on' : 'off'); } catch (e) {} if (on) ac(); return on; },
  };
})();

  const dm = S.mood - before.mood, dh = S.health - before.health, dmoney = S.money - before.money;
  let anim = out.anim, snd = null;
  if (!anim) {
    if (out.meExpr === 'happy') { anim = 'jump'; snd = 'fanfare'; }

function ph(){ if (!S.phone) S.phone = { threads:{}, unread:{}, pending:{} }; return S.phone; }
function pushMsg(th, who, t){ const p = ph(); (p.threads[th] = p.threads[th] || []).push({ who, t, d:S.day, time:SLOT_INFO[S.slot][1] }); }
function addUnread(th, n = 1){ const p = ph(); p.unread[th] = (p.unread[th] || 0) + n; S.flags.ring = true; }
const unreadCount = () => Object.values(ph().unread).reduce((a, b) => a + b, 0);
function maybeMsg(slot){
  if (!chance(.5)) return;
  const p = ph();
  const pool = shuffle(Object.entries(MSGS).filter(([id, m]) => m.ctx.includes(slot) && !S.once['m_' + id] && !p.pending[m.th] && (!m.cond || m.cond())));
  if (!pool.length) return;
  const [id, m] = pool[0];
  S.once['m_' + id] = true;
  m.msgs.forEach(([who, t]) => pushMsg(m.th, who, t));
  addUnread(m.th, m.msgs.length);
  if (m.replies) p.pending[m.th] = { id, deadline:(S.tick || 0) + 2 };
}
function tickPhone(){
  S.tick = (S.tick || 0) + 1;
  const p = ph();
  for (const [th, pd] of Object.entries(p.pending)) {
    if (pd.deadline > S.tick) continue;
    const m = MSGS[pd.id], ig = m.ignore || {};
    delete p.pending[th];
    if (ig.fx) ig.fx();
    if (ig.resp) { pushMsg(th, ig.who || m.msgs[0][0], ig.resp); addUnread(th); }
    if (ig.note) note(ig.note);
    clampAll();
  }
}
function replyMsg(th, i){
  const p = ph(), pd = p.pending[th]; if (!pd) return;
  const m = MSGS[pd.id], r = m.replies[i], before = snap();
  pushMsg(th, 'me', r.t);
  if (r.fx) r.fx();
  shapeGains(before, null, null);
  clampAll();
  if (r.resp) pushMsg(th, r.who || m.msgs[0][0], r.resp);
  delete p.pending[th];
  save(); updateHUD(); openThread(th, diffChips(before, snap()));
}

const LBL = { energy:'Năng lượng', health:'Sức khỏe', mood:'Tinh thần', tech:'Chuyên môn', soft:'Kỹ năng mềm' };
function diffChips(a, b, skipEnergy){
  const out = [];
  if (b.money !== a.money) { const d = b.money - a.money; out.push({ t:(d > 0 ? '+' : '−') + fmt(Math.abs(d)), good:d > 0, money:true }); }
  for (const k of ['energy','health','mood','tech','soft']) {
    if (skipEnergy && k === 'energy') continue;
    const d = Math.round(b[k] - a[k]);
    if (d) out.push({ t:`${d > 0 ? '+' : '−'}${Math.abs(d)} ${LBL[k]}`, good:d > 0 });
  }
  for (const k of Object.keys(b.rel)) {
    const d = Math.round(b.rel[k] - (a.rel[k] ?? b.rel[k]));
    if (d) out.push({ t:`${d > 0 ? '+' : '−'}${Math.abs(d)} ${PEOPLE[k].name}`, good:d > 0 });
  }
  return out;
}

      <p class="reply-lbl">Bạn trả lời:</p><div class="choices">${btns}</div></article>`;
  } else {
    const talk = current.talk || [];
    $('#stage').innerHTML = `<article class="scene">
      <div class="panel">${panelSVG(current.bg, current.npc, current.npcExpr, current.meExpr || (ty.t === 'random' && !current.meAnim ? 'panic' : undefined), current.title, { meAnim: current.meAnim || autoAnim(ref, ty), npcAnim: current.npcAnim, meExtras: current.meExtras || (ty.t === 'random' && !current.meAnim ? ['excl'] : undefined) })}</div>
      <header class="sh"><span class="si" aria-hidden="true">${current.icon || ''}</span><h2>${current.title}</h2></header>${typeHTML(ty)}
      ${current.html ? `<div class="st">${current.html}</div>` : ''}
      ${talk.length ? '<div id="talk"></div>' : ''}
      <div id="rest" ${talk.length ? 'hidden' : ''}><div class="choices">${btns}</div></div></article>`;
    if (talk.length) { talkIdx = 0; showTalk(); }
    armPanelSkip();
  }
  $('#stage').querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  window.scrollTo({ top:0 });
  if (ref.id === 'wake') { SFX.play('alarm'); SFX.play(WAKE_ANIM[wakeAnimKey()].snd, 650); }
  else if (current.kind === 'phone') SFX.play('notify');
  else if (ty.t) SFX.play({ random:'pop', consequence:'dun', scheduled:'bell' }[ty.t]);
}
function showTalk(focus){
  const talk = current.talk, line = talk[talkIdx], isMe = line.w === 'me', last = talkIdx >= talk.length - 1;
  const side = isMe ? (current.npc ? 'me' : 'solo') : 'npc';
  if (talkIdx > 0 || focus) { bobSpeaker(isMe ? 'me' : 'npc'); SFX.play('talk'); }
  $('#talk').innerHTML = `<div class="bubble ${side}"><span class="who">${esc(speakerName(line.w))}</span><span>${line.t}</span></div>
    ${last ? '' : `<div class="talk-ctl"><span class="talk-n">${talkIdx + 1}/${talk.length}</span><button class="ghost sm" type="button" id="tSkip">Bỏ qua</button><button class="btn sm" type="button" id="tNext">Tiếp</button></div>`}`;
  if (last) { $('#rest').hidden = false; if (focus) { const c = $('#rest .choice:not([disabled])'); if (c) c.focus({ preventScroll:true }); } return; }
  $('#tNext').addEventListener('click', () => { talkIdx++; showTalk(true); });
  $('#tSkip').addEventListener('click', () => { talkIdx = talk.length - 1; showTalk(true); });
  if (focus) $('#tNext').focus({ preventScroll:true });
}

function choose(i){
  const ch = current && current.choices[i];
  if (!ch || ch.disabled || (ch.cost && S.money < ch.cost)) return;
  const before = snap();
  if (ch.cost) S.money -= ch.cost;
  let out = ch.fx ? ch.fx() : '';
  shapeGains(before, ch.actId, ch.npc !== undefined ? ch.npc : (current.kind === 'phone' ? null : current.npc));
  clampAll();
  if (typeof out === 'string') out = { text:out };
  out = out || {};
  if (current.kind === 'phone') {
    const th = current.from, who = THREAD_WHO[th] || th;
    current.msgs.forEach(t => pushMsg(th, who, t));
    const q = ch.label.match(/“([^”]+)”/); pushMsg(th, 'me', q ? q[1] : ch.label);
  }
  if (out.go === 'nextday') return tearAndNext();
  if (out.go === 'week') { S.phase = 'end'; S.cur = null; save(); return renderWeek(); }
  const chips = diffChips(before, snap());
  const sceneNpc = current.kind === 'phone' ? null : current.npc;
  const npc = out.npc !== undefined ? out.npc : ch.npc !== undefined ? ch.npc : sceneNpc;
  let nExpr = out.npcExpr;
  if (!nExpr && npc && S.rel[npc] !== undefined) { const d = S.rel[npc] - before.rel[npc]; nExpr = d > 0 ? 'happy' : d < 0 ? 'annoyed' : (npc === sceneNpc ? current.npcExpr : undefined); }
  if (!nExpr && npc === 'family') { const d = S.rel.family - before.rel.family; nExpr = d > 0 ? 'happy' : d < 0 ? 'sad' : undefined; }
  const bg = out.bg || ch.bg || (current.kind === 'phone' ? 'home' : current.bg);
  const fx = resultFx(out, before);
  S.cur = null; save();
  if (out.silent || (!out.text && !chips.length)) return advance();
  updateHUD();
  $('#stage').innerHTML = `<article class="scene result">
    <div class="panel">${panelSVG(bg, npc, nExpr, out.meExpr, current.title, { meAnim: fx.anim, npcAnim: npcReact(nExpr) })}</div>
    <header class="sh"><span class="si" aria-hidden="true">${current.icon || '📝'}</span><h2>${current.title}</h2></header>
    <div class="st">${P(out.text)}</div>
    ${chips.length ? `<div class="chips">${chipsHTML(chips)}</div>` : ''}
    <button class="btn" type="button" id="next">Tiếp tục</button></article>`;
  const nb = $('#next'); nb.addEventListener('click', advance); nb.focus({ preventScroll:true });
  armPanelSkip(); if (fx.snd) SFX.play(fx.snd);
}

function openThread(th, chips){
  const p = ph(), T_ = THREADS[th], msgs = p.threads[th] || [], pd = p.pending[th];

    ${chips && chips.length ? `<div class="chips">${chipsHTML(chips)}</div>` : ''}
    ${pd ? `<p class="reply-lbl">Trả lời (nếu để quá lâu, ${T_.name.toLowerCase() === 'bố mẹ' ? 'bố mẹ' : 'họ'} sẽ phật lòng):</p>${replies}` : ''}`;
  $('#phBack').addEventListener('click', renderPhoneList);

  $('#dlgBody').querySelectorAll('.reply').forEach(b => b.addEventListener('click', () => replyMsg(th, +b.dataset.r)));
  const box = $('#dlgBody .thread'); if (box) box.scrollTop = box.scrollHeight;

function tearAndNext(){
  S.cur = null;
  const page = $('#calPage');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#stage').querySelectorAll('button').forEach(b => b.disabled = true);

const midName = k => PEOPLE[k].name.replace(/^(Chị|Anh|Bố) /, m => m.toLowerCase());

function renderWeek(){
  updateHUD();
  $('#bars').hidden = true;
  const w0 = S.w0, b = BAL.BG[S.bg];
  const spent = w0.money - S.money;
  const avgSleep = S.sleepLog.length ? S.sleepLog.reduce((x, y) => x + y, 0) / S.sleepLog.length : 8;
  const c = S.job ? COMPANIES[S.job.co] : null;

  // Công việc
  let jobHTML;
  if (c) {
    const perf = S.perf >= 8 ? 'Xuất sắc. Chị Hạnh nhắc tên bạn trong buổi họp cuối tuần.' : S.perf >= 4 ? 'Ổn, có tiềm năng. Chị Hạnh thấy bạn chịu khó.'
               : S.perf >= 1 ? 'Tạm được. Còn đang làm quen.' : 'Chị Hạnh bắt đầu hỏi thăm bạn hơi nhiều.';
    jobHTML = P(`${c.icon} ${c.name} (${c.type}), lương ${fmtTr(S.job.salary)}/tháng.`,
                `Số task đã làm: ${S.stat.tasks}. Lỗi để lại: ${S.stat.bugsMade}. Buổi OT: ${S.stat.ot}. Số lần đi muộn: ${S.stat.lateWork}.`,
                `Đánh giá của trưởng nhóm: ${perf}`,
                S.flags.bugMonday ? 'Còn một lỗi đang chờ bạn vào sáng thứ Hai.' : '');
  } else jobHTML = P('Bạn chưa có việc sau tuần đầu tiên.', S.flags.jobSearch ? 'Bạn đã lưu lại một loạt tin tuyển dụng cho tuần sau.' : 'Tuần sau sẽ là một tuần tìm việc nghiêm túc hơn.');

  // Tài chính
  const need = b.rent + BAL.LIVING_PER_MONTH * BAL.DAYS_TO_PAYDAY / 30;
  let finLabel, finHTML;
  if (c) {
    const r = S.money / need;
    finLabel = r >= 1.6 ? 'Thoải mái' : r >= 1 ? 'Ổn định' : r >= .6 ? 'Hơi chật vật' : 'Báo động';
    finHTML = P(`Lương tháng đầu ${fmtTr(S.job.salary)} sẽ về vào ngày 10/12, còn ${BAL.DAYS_TO_PAYDAY} ngày nữa.`,
                `Từ giờ đến lúc đó, bạn cần khoảng ${fmt(need)} cho ăn ở${b.rent ? ` (gồm tiền nhà ${fmt(b.rent)})` : ''}. Hiện có ${fmt(S.money)}.`);
  } else {
    const perDay = Math.max(spent, 100000) / 7;
    const days = Math.floor((S.money - b.rent) / perDay);
    finLabel = days >= 45 ? 'Ổn định' : days >= 20 ? 'Hơi chật vật' : 'Báo động';
    finHTML = P(`Với mức chi tiêu tuần này${b.rent ? ' và tiền nhà sắp đến hạn' : ''}, số tiền còn lại đủ sống khoảng ${Math.max(days, 0)} ngày.`);
  }
  finHTML = P(`Đầu tuần ${fmt(w0.money)}, cuối tuần ${fmt(S.money)}. Đã tiêu ${fmt(Math.max(spent, 0))}.`) + finHTML +
            P(`Tình trạng tài chính: <b>${finLabel}</b>.`, S.flags.loanTung ? `Tùng đang nợ bạn ${fmt(S.flags.loanTung)}. Hạn trả: “cuối tháng”.` : '');

  // Quan hệ
  const met = Object.keys(PEOPLE).filter(k => !PEOPLE[k].work || (S.job && S.day >= S.job.start));
  const relRows = met.map(k => { const d = S.rel[k] - w0.rel[k]; const v = S.rel[k];
    return `<div class="rel-row"><span aria-hidden="true">${PEOPLE[k].icon}</span><span>${PEOPLE[k].name}</span>
      <div class="bar"><i class="${v < 30 ? 'low' : v < 55 ? 'mid' : ''}" style="width:${v}%"></i></div>
      <span class="dv ${d > 0 ? 'good' : d < 0 ? 'bad' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${d ? Math.abs(d) : '0'}</span></div>`; }).join('');
  const deltas = met.map(k => [k, S.rel[k] - w0.rel[k]]).sort((x, y) => y[1] - x[1]);

  // Câu chuyện
  const story = [];
  story.push(c ? `Tuần đầu tiên sau tốt nghiệp khép lại với một công việc ở ${c.name}.` : 'Tuần đầu tiên sau tốt nghiệp khép lại mà bạn vẫn chưa có việc, nhưng ít nhất bạn đã biết phỏng vấn trông như thế nào.');
  story.push(avgSleep < 6 ? `Trung bình mỗi đêm bạn ngủ ${fmtH(avgSleep)}, ít như dân kế toán mùa quyết toán.`
            : avgSleep >= 7.5 ? `Bạn ngủ trung bình ${fmtH(avgSleep)} mỗi đêm, đều đặn đến mức đáng ngưỡng mộ.`
            : `Giấc ngủ trung bình ${fmtH(avgSleep)} mỗi đêm, ở mức “tạm chấp nhận được”.`);
  if (deltas[0] && deltas[0][1] > 0) story.push(`Người thân thiết với bạn hơn nhiều nhất tuần này là ${midName(deltas[0][0])}.`);
  const worst = deltas[deltas.length - 1];
  if (worst && worst[1] < 0) story.push(`Còn ${midName(worst[0])} thì có vẻ hơi phật lòng.`);
  if (S.stat.miTom >= 3) story.push('Mì tôm đã trở thành một phần quan trọng của cuộc sống.');
  else if (S.nutr >= 65) story.push('Bạn ăn uống khá tử tế, điều mà không phải người mới ra trường nào cũng làm được.');
  if (S.flags.liedSalary) story.push('Cả xóm đang tin rằng lương của bạn cao hơn thực tế. Áp lực đã bắt đầu.');
  story.push('Tuần sau sẽ ra sao? Đó là câu hỏi của bản đầy đủ.');

  const badges = BADGES.filter(x => x.test());
  const memoHTML = S.memo.length ? `<ul class="memo">${S.memo.map(m => `<li><b>${DAYS[m.day].dow}:</b> ${m.text}</li>`).join('')}</ul>` : P('Một tuần trôi qua khá êm ả.');
  const statLine = (k, ic) => { const d = S[k] - w0[k]; return `<span class="chip ${d > 0 ? 'good' : d < 0 ? 'bad' : ''}">${ic} ${LBL[k]} ${S[k]} (${d >= 0 ? '+' : '−'}${Math.abs(d)})</span>`; };

  $('#stage').innerHTML = `<article class="scene report">
    <div class="hero">${chibiSVG(playerLook('casual'), S.mood >= 60 ? 'happy' : S.mood < 35 ? 'sad' : 'neutral', { label:'Nhân vật cuối tuần' })}</div>
    <h2>Tổng kết tuần đầu tiên</h2>
    <p style="color:var(--muted)">${esc(S.name)}, 22 tuổi, Hà Thành.</p>
    <div class="journal story"><p>${story.join(' ')}</p></div>
    <h3>Công việc</h3>${jobHTML}
    <h3>Tiền bạc</h3>${finHTML}
    <h3>Bản thân</h3>
    <div class="chips">${statLine('health','❤️')}${statLine('mood','🙂')}${statLine('tech','🧠')}${statLine('soft','🗣️')}</div>
    <p>Ăn uống: ${nutrWord()}. Mì tôm: ${S.stat.miTom} bữa. Số đêm ngủ sau 0 giờ: ${S.stat.lateNights}.</p>
    ${foodHTML()}
    <h3>Các mối quan hệ</h3>${relRows}
    <h3>Danh hiệu</h3>
    ${badges.length ? `<div class="badges">${badges.map(x => `<div class="badge"><b>${x.icon} ${x.name}</b><span>${x.desc}</span></div>`).join('')}</div>` : P('Chưa có danh hiệu nào. Thử một cách sống khác xem sao.')}
    <p style="color:var(--muted);font-size:14px">Đã mở ${badges.length}/${BADGES.length} danh hiệu.</p>
    <h3>Những quyết định đáng nhớ</h3>${memoHTML}
    <button class="btn" type="button" id="again">Chơi lại với lựa chọn khác</button>
  </article>`;
  $('#again').addEventListener('click', () => { wipe(); S = null; renderTitle(); });
  window.scrollTo({ top:0 });
}

    <header class="sh"><span class="si" aria-hidden="true">🎓</span><h2>Tạo nhân vật</h2></header>
    <p>Bạn 22 tuổi, vừa tốt nghiệp ngành Công nghệ thông tin, đang sống ở Hà Thành.</p>
    <div class="field"><label for="nm">Tên nhân vật</label><input id="nm" maxlength="24" value="${pick(['Minh','An','Khánh','Ngọc','Hà','Long'])}" autocomplete="off"></div>
    <div class="field"><span class="lab">Giới tính</span><div class="gopts">
      <button type="button" class="gopt" data-g="nam" aria-pressed="true">Nam</button>
      <button type="button" class="gopt" data-g="nu" aria-pressed="false">Nữ</button></div></div>
    <div class="field"><span class="lab">Ngoại hình</span>
      <div class="look">
        <div class="look-pv" id="pv"></div>
        <div class="look-opts">
          <span class="sub">Kiểu tóc</span><div class="hairs" id="hairs"></div>
          <span class="sub">Màu tóc</span><div class="sws" id="hcs"></div>
          <span class="sub">Màu da</span><div class="sws" id="sks"></div>
          <button type="button" class="ghost sm" id="rnd">🎲 Ngẫu nhiên</button>
        </div>
      </div></div>
    <div class="field"><span class="lab">Hoàn cảnh xuất phát</span>
      ${BGS.map(b => `<button type="button" class="bgopt" data-b="${b.k}" aria-pressed="false">
        <span class="cl">${b.icon} ${b.label}</span><span class="cd">${b.desc}</span>
        <span class="chips">${b.hints.map(h => `<span class="chip">${h}</span>`).join('')}</span></button>`).join('')}</div>
    <button class="btn" type="button" id="go" disabled>Bắt đầu tuần mới</button>
    <p class="hint" id="goHint">Chọn một hoàn cảnh xuất phát để bắt đầu.</p>
  </article>`;
  const go = $('#go');
  const refresh = () => {
    $('#pv').innerHTML = chibiSVG(lookToL(st.look, 'casual', st.gender), 'happy', { label:'Xem trước nhân vật' });
    const base = lookToL(st.look, 'casual', st.gender);
    const fitH = catBy('hair').filter(h => h.fit.includes(st.gender)), altH = catBy('hair').filter(h => !h.fit.includes(st.gender));
    $('#hairs').innerHTML = [...fitH, ...altH].map(h => `<button type="button" class="hairopt${h.fit.includes(st.gender) ? '' : ' alt'}" data-id="${h.id}" aria-pressed="${st.look.hair === h.id}" aria-label="Kiểu tóc ${h.name}">${headSVG({ ...base, hair:h.id })}<span>${h.name}</span></button>`).join('');
    $('#hcs').innerHTML = catBy('hairColor').map(c => `<button type="button" class="sw" data-id="${c.id}" style="background:${c.value}" aria-pressed="${st.look.hairColor === c.id}" aria-label="Màu tóc ${c.name}" title="${c.name}"></button>`).join('');
    $('#sks').innerHTML = catBy('skin').map(c => `<button type="button" class="sw" data-id="${c.id}" style="background:${c.value}" aria-pressed="${st.look.skin === c.id}" aria-label="Màu da ${c.name}" title="${c.name}"></button>`).join('');
    $('#hairs').querySelectorAll('.hairopt').forEach(b => b.addEventListener('click', () => { st.look.hair = b.dataset.id; st.hairTouched = true; refresh(); }));
    $('#hcs').querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { st.look.hairColor = b.dataset.id; refresh(); }));
    $('#sks').querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { st.look.skin = b.dataset.id; refresh(); }));
  };
  refresh();
  $('#rnd').addEventListener('click', () => {
    st.look.hair = pick(catBy('hair').filter(h => h.fit.includes(st.gender))).id; st.look.hairColor = pick(catBy('hairColor')).id; st.look.skin = pick(catBy('skin')).id;
    st.hairTouched = true; refresh();
  });
  document.querySelectorAll('.gopt').forEach(b => b.addEventListener('click', () => {
    st.gender = b.dataset.g; document.querySelectorAll('.gopt').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (!CAT[st.look.hair].fit.includes(st.gender)) st.look.hair = defaultLook(st.gender).hair;
    refresh();
  }));
  document.querySelectorAll('.bgopt').forEach(b => b.addEventListener('click', () => {
    st.bg = b.dataset.b; document.querySelectorAll('.bgopt').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    go.disabled = false; $('#goHint').hidden = true;
  }));
  go.addEventListener('click', () => {
    const name = ($('#nm').value || '').trim() || 'Minh';
    if (!st.bg) return;
    newGame(name, st.gender, st.bg, { ...st.look });
  });
}

/* ----- Hồ sơ ----- */
function openProfile(){
  if (!S) return;
  const bgName = { nha:'Ở cùng bố mẹ', tro:'Thuê trọ một mình', ghep:'Ở ghép với Tùng' }[S.bg];
  const job = S.job ? `${COMPANIES[S.job.co].name}, ${fmtTr(S.job.salary)}/tháng` : 'Chưa có việc';
  const met = Object.keys(PEOPLE).filter(k => !PEOPLE[k].work || (S.job && S.day >= S.job.start));
  const skill = (k, ic) => `<div style="margin-top:8px"><div class="bar-l"><span>${ic} ${LBL[k]}</span><b>${S[k]}</b></div><div class="bar"><i style="width:${S[k]}%"></i></div></div>`;
  $('#dlgBody').innerHTML = `<div class="prof-top"><span class="ph-av big">${headSVG(playerLook('casual'), playerExpr())}</span><h2>${esc(S.name)}</h2></div>
    <div class="kv" style="margin-top:10px">
      <span>Hoàn cảnh</span><span>${bgName}</span>
      <span>Công việc</span><span>${job}</span>
      <span>Giấc ngủ gần nhất</span><span>${S.day > 1 ? fmtH(S.sleep) : 'Chưa có'}</span>
      <span>Ăn uống dạo này</span><span>${nutrWord()}</span>
    </div>
    <h3>Kỹ năng</h3>${skill('tech','🧠')}${skill('soft','🗣️')}
    <h3>CV đã nộp</h3>${cvHTML()}
    <h3>Hồ sơ ăn uống</h3>${foodHTML()}
    <h3>Các mối quan hệ</h3>
    ${met.map(k => `<div class="rel-row" style="grid-template-columns:26px 1fr 90px 34px"><span aria-hidden="true">${PEOPLE[k].icon}</span>
      <span>${PEOPLE[k].name}<br><small style="color:var(--muted)">${PEOPLE[k].note}</small></span>
      <div class="bar"><i class="${S.rel[k] < 30 ? 'low' : S.rel[k] < 55 ? 'mid' : ''}" style="width:${S.rel[k]}%"></i></div><span class="dv">${S.rel[k]}</span></div>`).join('')}
    <button class="btn alt" type="button" id="closeDlg">Đóng</button>`;
  const dlg = $('#dlg'); dlg.classList.remove('phone-dlg');
  $('#closeDlg').addEventListener('click', closeDlg);
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
$('#btnProfile').addEventListener('click', openProfile);
const soundLabel = () => { $('#btnSound').textContent = SFX.on ? '🔊 Âm thanh' : '🔇 Tắt tiếng'; $('#btnSound').setAttribute('aria-pressed', String(SFX.on)); };
soundLabel(); $('#btnSound').addEventListener('click', () => { SFX.toggle(); soundLabel(); if (SFX.on) SFX.play('pop'); });
$('#phoneFab').addEventListener('click', openPhone);
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg(); });

let restartArmed = null;
$('#btnRestart').addEventListener('click', e => {
  const b = e.currentTarget;
  if (restartArmed) { clearTimeout(restartArmed); restartArmed = null; b.textContent = 'Chơi lại từ đầu'; wipe(); S = null; renderTitle(); return; }
  b.textContent = 'Bấm lần nữa để xác nhận';
  restartArmed = setTimeout(() => { restartArmed = null; b.textContent = 'Chơi lại từ đầu'; }, 3000);
});

renderTitle();
</script>
</body>
</html>
